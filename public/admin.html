<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container">
        <h2>Administrator Control Panel</h2>
        <div id="message"></div>
        
        <form id="loginForm" style="display: none;">
            <label>Username:</label>
            <input type="text" id="username" required placeholder="Introduceți utilizatorul">
            <label>Password:</label>
            <input type="password" id="password" required placeholder="Introduceți parola">
            <button type="submit" style="width: 100%;">Autentificare</button>
        </form>
        
        <div id="uploadSection" style="display: none;">
            <button id="logoutBtn">Logout</button>
            <p style="margin: 0 0 15px 0; font-weight: 500; color: #666;">Ești logat ca administrator.</p>
            
            <div class="dashboard-layout">
                <div class="dashboard-column">
                    <h3>Preluare Date</h3>
                    <form id="uploadForm">
                        <label>Încarcă un fișier nou (CSV/Excel):</label>
                        <input type="file" id="fileToUpload" required accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel">
                        <button type="submit" style="width: 100%;">Încarcă Fișier</button>
                    </form>
                    <hr>
                    <h3>Procesare Fișiere</h3>
                    <label>Importă toate fișierele încărcate:</label>
                    <button id="importAllBtn" style="width: 100%;">Procesează Toate Fișierele</button>
                    <hr>
                    <div class="danger-zone" style="padding: 10px; border-radius: 10px; margin-top: 5px;">
                        <h3 style="color: var(--danger-color); border-bottom-color: #ffd6db; font-size: 1rem; margin-bottom: 5px;">Șterge toată Baza de Date</h3>
                        <button type="button" id="wipeDataBtn" style="background: var(--danger-color); width: 100%;">Șterge</button>
                    </div>
                </div>

                <div class="dashboard-column">
                    <h3>Management Admini</h3>
                    <div id="adminManagerForm">
                        <label>Username:</label>
                        <input type="text" id="newAdminUsername" placeholder="Ex: walter_white">
                        <label>Parolă:</label>
                        <input type="password" id="newAdminPassword" placeholder="Parolă nouă">
                        
                        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 15px;">
                            <button type="button" id="btnCreateAdmin" style="background: var(--pink-dark); width: 100%;">Creează Admin</button>
                            <button type="button" id="btnUpdateAdmin" style="background: #a35070; width: 100%;">Actualizează Parolă</button>
                            <button type="button" id="btnDeleteAdmin" style="background: var(--danger-color); width: 100%;">Șterge Admin</button>
                        </div>
                    </div>
                </div>

                <div class="dashboard-column">
                    <h3>Gestionare Date</h3>
                    <div id="recordManagerForm">
                        <label>Selectează Tabelul:</label>
                        <select id="crudTableSelect">
                            <option value="emergencies">Urgențe Medicale (emergencies)</option>
                            <option value="seizures">Capturi Droguri (seizures)</option>
                            <option value="demographics">Infracțiuni (demographics)</option>
                            <option value="sentences">Infracțiuni Sentințe (sentences)</option>
                            <option value="articles">Infracțiuni Articole (articles)</option>
                            <option value="projects">Proiecte Prevenire (projects)</option>
                            <option value="campaigns">Campanii Prevenire (campaigns)</option>
                            <option value="activities">Activități Prevenire (activities)</option>
                            <option value="general">Date Generale (general)</option>
                            <option value="groups">Grupuri Infracționale (groups)</option>
                        </select>

                        <label>ID Înregistrare:</label>
                        <input type="number" id="recordId" placeholder="Ex: 5">

                        <label>Date:</label>
                        <textarea id="recordJsonData" rows="4" placeholder='Exemplu:{"year": 2022, "drug_type": "Cannabis", "count": 14}'></textarea>
                        
                        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 5px;">
                            <button type="button" id="btnCreateRecord" style="background: var(--success-color); width: 100%;">Inserează Date (POST)</button>
                            <button type="button" id="btnUpdateRecord" style="background: var(--warning-color); color: #333; width: 100%;">Actualizează Date (PATCH)</button>
                            <button type="button" id="btnDeleteRecord" style="background: var(--danger-color); width: 100%;">Șterge Înregistrare (DELETE)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <a href="index.html" class="back-link">⬅ Înapoi la Pagina de Filtrare</a>
    </div>

    <script src="js/admin.js" defer></script>
</body>
</html>
