<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drug Explorer on Web</title>
    <link rel="stylesheet" href="css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"
      defer
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts" defer></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
      defer
    ></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img
          src="assets/walter-pink.webp"
          alt="Walter Pink"
          class="profile-pic"
        />
        <h1>Walter Pink</h1>
      </div>
      <a href="admin.html" class="btn-pink admin-btn">Admin panel</a>
    </header>

    <div class="container main-content">
      <section class="filters-section">
        <h2>Selectează Filtre</h2>

        <div class="filter-controls">
          <select id="filter-table" class="elegant-select">
            <option value="seizures">Confiscări</option>
            <option value="emergencies">Urgențe Medicale</option>
            <option value="articles">Infracțiuni (Articole)</option>
            <option value="demographics">Infracțiuni (Demografic)</option>
            <option value="sentences">Infracțiuni (Sentințe)</option>
            <option value="general">Infracțiuni (General)</option>
            <option value="groups">Infracțiuni (Grupuri)</option>
            <option value="activities">Activități de prevenire</option>
            <option value="projects">Proiecte de Prevenire</option>
            <option value="campaigns">Campanii de prevenire</option>
          </select>

          <div class="slider-wrapper">
            <div class="slider-labels">
              <span>An:</span>
              <span id="year-display">2020 - 2026</span>
            </div>
            <div id="year-slider"></div>
          </div>

          <select
            id="filter-drug"
            class="elegant-select hidden-select"
          ></select>

          <select
            id="filter-sentence"
            class="elegant-select hidden-select"
          ></select>

          <div id="dynamic-filters" class="dynamic-filters-container"></div>

          <div id="count-filters" class="count-filters-container">
            <span class="count-label">Cazuri / Count</span>
            <div class="count-inputs-wrapper">
              <input
                type="number"
                id="filter-min-count"
                class="count-input"
                placeholder="Min"
              />
              <span class="count-separator">-</span>
              <input
                type="number"
                id="filter-max-count"
                class="count-input"
                placeholder="Max"
              />
            </div>
          </div>

          <button id="btn-load" class="btn-pink btn-load-right">
            Filtrează Date
          </button>
        </div>

        <div class="bottom-actions">
          <div class="export-row">
            <span>Export raport general:</span>
            <button class="export-btn" id="btn-export-csv">CSV</button>
            <button class="export-btn" id="btn-export-html">HTML</button>
          </div>

          <div class="view-controls" id="view-selector-container">
            <label for="chart-selector" class="chart-selector-label"
              >Afișează:</label
            >
            <select id="chart-selector" class="elegant-select">
              <option value="all">Toate (Tabel + Grafice)</option>
              <option value="container-table">Doar Tabelul de Date</option>
              <option value="container-bar">Doar Graficul cu Bare</option>
              <option value="container-line">Doar Graficul cu Linii</option>
            </select>
          </div>
        </div>
      </section>

      <div id="status-message"></div>

      <section class="visualizations hidden-section" id="charts-wrapper">
        <div class="chart-container view-section" id="container-table">
          <h3>Tabel Date</h3>

          <div class="table-responsive-wrapper">
            <table id="data-table" class="data-table-main">
              <thead class="table-header-pink">
                <tr id="table-header">
                  <th></th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div class="pagination-wrapper">
            <button id="btn-prev" class="btn-pink">← Anterior</button>
            <span id="page-info" class="page-info-text"
              >Pagina <strong id="current-page">1</strong> din
              <strong id="total-pages">1</strong></span
            >
            <button id="btn-next" class="btn-pink">Următor →</button>
            <div class="export-table-buttons">
              <button id="btn-export-table-png">PNG</button>
              <button id="btn-export-table-webp">WebP</button>
              <button id="btn-export-table-svg">SVG</button>
            </div>
          </div>
        </div>

        <div class="chart-container view-section" id="container-bar">
          <h3>Bar chart</h3>
          <div id="chartBar"></div>
          <div class="download-btns">
            <button id="btn-export-bar-png">PNG</button>
            <button id="btn-export-bar-webp">WebP</button>
            <button id="btn-export-bar-svg">SVG</button>
          </div>
        </div>

        <div class="chart-container view-section" id="container-line">
          <h3>Line chart</h3>
          <div id="chartLine"></div>
          <div class="download-btns">
            <button id="btn-export-line-png">PNG</button>
            <button id="btn-export-line-webp">WebP</button>
            <button id="btn-export-line-svg">SVG</button>
          </div>
        </div>
      </section>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
