services:
  web:
    build: .
    container_name: DEW_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/uploads &&
             composer install --no-dev --working-dir=/var/www/html &&
             apache2-foreground"